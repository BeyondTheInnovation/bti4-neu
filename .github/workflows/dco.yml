name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git log --no-merges --format=%H "$BASE..$HEAD"); do
            author=$(git log -1 --format=%an "$sha")
            case "$author" in
              *"[bot]"*) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "Missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off commits with git commit -s. See CONTRIBUTING.md."
            exit 1
          fi
